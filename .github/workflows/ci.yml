name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Point Testcontainers at the Docker daemon
        run: |
          if docker version; then
            host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
            echo "Docker endpoint: $host"
            echo "DOCKER_HOST=$host" >> "$GITHUB_ENV"
            # Docker Engine 29+ rejects API versions below 1.44, older than docker-java's default.
            echo "api.version=1.44" >> "$HOME/.docker-java.properties"
          else
            echo "::warning::Docker is not available; PostgreSQL integration tests will be skipped"
          fi
      - name: Build and test
        run: mvn -B verify
