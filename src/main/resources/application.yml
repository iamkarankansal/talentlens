spring:
  application:
    name: talentlens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentlens}
    username: ${DB_USERNAME:talentlens}
    password: ${DB_PASSWORD:talentlens}
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_FILE_SIZE:5MB}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    # redis, simple (in-memory, per instance) or none.
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: ${CACHE_TTL:10m}
      key-prefix: "talentlens:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  flyway:
    # Databases created before migrations existed already hold the V1 schema.
    baseline-on-migrate: true
    baseline-version: "1"
    # Shared migrations, plus database-specific ones such as the pgvector tables.
    locations: "classpath:db/migration,classpath:db/vendor/{vendor}"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

talentlens:
  ai:
    client:
      # Calls to the model provider, including the first one. Rate limits, server errors and timeouts are retried.
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${AI_RETRY_INITIAL_BACKOFF:2s}
      backoff-multiplier: ${AI_RETRY_MULTIPLIER:2.0}
      max-backoff: ${AI_RETRY_MAX_BACKOFF:30s}
      connect-timeout: ${AI_CONNECT_TIMEOUT:10s}
      read-timeout: ${AI_READ_TIMEOUT:60s}
    rate-limit:
      # AI calls one client (by remote address) may make per window. 0 turns the limit off.
      requests: ${AI_RATE_LIMIT_REQUESTS:30}
      window: ${AI_RATE_LIMIT_WINDOW:1m}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    # The account registered with this email becomes an ADMIN. Everyone else starts as a CANDIDATE.
    admin-email: ${ADMIN_EMAIL:}
    # When true, write and AI endpoints need a RECRUITER or ADMIN bearer token. Reads, login and registration stay open.
    auth-enforced: ${AUTH_ENFORCED:false}
    login-throttle:
      # Failed logins in a row for one email before it is locked out. 0 turns the throttle off.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lockout: ${LOGIN_LOCKOUT:15m}
    jwt:
      # At least 32 bytes. When empty, a random key is generated at startup and tokens stop working on restart.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: ${JWT_ISSUER:talentlens}

logging:
  pattern:
    # Every log line written while handling a request carries its X-Request-Id.
    level: "%5p [%X{requestId:-}]"

management:
  health:
    redis:
      # Turn on together with CACHE_TYPE=redis, otherwise health reports DOWN without a Redis server.
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        # Comma-separated actuator endpoints served over HTTP.
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets for model call timers, so Prometheus can compute latency percentiles.
      percentiles-histogram:
        "[talentlens.ai.model.calls]": true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
