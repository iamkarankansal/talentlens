spring:
  application:
    name: talentlens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentlens}
    username: ${DB_USERNAME:talentlens}
    password: ${DB_PASSWORD:talentlens}
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_FILE_SIZE:5MB}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases created before migrations existed already hold the V1 schema.
    baseline-on-migrate: true
    baseline-version: "1"
    # Shared migrations, plus database-specific ones such as the pgvector tables.
    locations: "classpath:db/migration,classpath:db/vendor/{vendor}"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

talentlens:
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    # The account registered with this email becomes an ADMIN. Everyone else starts as a CANDIDATE.
    admin-email: ${ADMIN_EMAIL:}
    jwt:
      # At least 32 bytes. When empty, a random key is generated at startup and tokens stop working on restart.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: ${JWT_ISSUER:talentlens}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
