spring:
  application:
    name: talentlens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentlens}
    username: ${DB_USERNAME:talentlens}
    password: ${DB_PASSWORD:talentlens}
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_FILE_SIZE:5MB}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Databases created before migrations existed already hold the V1 schema.
    baseline-on-migrate: true
    baseline-version: "1"
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
