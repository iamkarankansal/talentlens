# Tests run against an in-memory H2 database and never call a real model.
# Flyway builds the schema there too, and Hibernate only validates it.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Caching is off by default so tests see every write; CachingApiTests turns on the in-memory cache.
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    locations: "classpath:db/migration,classpath:db/vendor/{vendor}"
  ai:
    openai:
      api-key: test-key

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
