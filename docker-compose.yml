services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talentlens
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/talentlens
      DB_USERNAME: talentlens
      DB_PASSWORD: talentlens
    ports:
      - "8080:8080"

volumes:
  pgdata:
